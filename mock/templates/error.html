{% extends "base.html" %}
{% block title %}{{ title }}{% if store %} · {{ store.name }}{% endif %}{% endblock %}
{% block body %}
<div class="page"><div class="wrap" style="max-width:680px">
  <div class="panel error-panel" data-testid="error">
    <div class="icon">!</div>
    <h2 class="err" style="font-family:var(--font-head)">{{ title }}</h2>
    <p data-testid="error-message" style="font-size:16px;color:var(--muted)">{{ message }}</p>
    {% if store %}<p style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="/s/{{ store.id }}/returns">Back</a>
      <a class="btn secondary" href="mailto:{{ store.support_email }}">Contact support</a></p>{% endif %}
  </div>
</div></div>
{% endblock %}
