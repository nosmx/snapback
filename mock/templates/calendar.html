<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · mock world</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e6e6e3; --line-soft: #f0f0ee;
    --accent: #3d5afe; --accent-soft: #e8ecff; --event: #3d5afe; --event-ink: #fff; --today: #e8ecff; --now: #e5484d;
    --hour: 72px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --panel: #1f1f22; --ink: #ededed; --muted: #9a9aa0; --line: #2e2e33; --line-soft: #26262a;
            --accent: #8c9eff; --accent-soft: #262b45; --event: #5c6ff5; --today: #22263b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .range { font-size: 18px; font-weight: 600; margin-left: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #30a46c; display: inline-block; animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .wrap { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; padding: 12px 16px; } }
  .week { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
  .days { display: grid; grid-template-columns: 56px repeat(7, minmax(92px, 1fr)); position: sticky; top: 0; background: var(--panel); z-index: 3; border-bottom: 1px solid var(--line); }
  .days div { padding: 8px 6px; text-align: center; font-size: 12px; color: var(--muted); }
  .days b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .days .is-today b { color: #fff; background: var(--accent); border-radius: 50%; width: 34px; height: 34px; line-height: 34px; margin: 2px auto 0; font-size: 17px; }
  .grid { display: grid; grid-template-columns: 56px repeat(7, minmax(92px, 1fr)); position: relative; }
  .gutter div { height: var(--hour); font-size: 11px; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-7px); }
  .col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent var(--hour)); }
  .col.is-today { background-color: var(--today); }
  .now { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 2; }
  .now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
  .ev { position: absolute; left: 4px; right: 4px; border-radius: 7px; background: var(--event); color: var(--event-ink); padding: 3px 7px; font-size: 11.5px; line-height: 1.3; overflow: hidden; cursor: pointer; z-index: 1; box-shadow: 0 1px 2px rgba(0,0,0,.15); border: 0; text-align: left; }
  .ev strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev span { opacity: .85; white-space: nowrap; }
  .ev.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .ev.new { animation: pop 1.2s ease-out 3; }
  @keyframes pop { 0% { box-shadow: 0 0 0 0 rgba(61,90,254,.7); } 100% { box-shadow: 0 0 0 14px rgba(61,90,254,0); } }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .notes { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--bg); border-radius: 8px; padding: 10px; margin: 0; }
  .notes a { color: var(--accent); }
  .empty { color: var(--muted); }
  .list button { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
  .list small { color: var(--muted); display: block; }
</style>
</head>
<body>
<header>
  <h1>Calendar</h1><span class="chip"><i></i>Snapback</span>
  <span class="range" id="range"></span>
  <div class="nav">
    <span class="live"><i></i>Live</span>
    <button id="prev" aria-label="Previous week">‹</button>
    <button id="today">Today</button>
    <button id="next" aria-label="Next week">›</button>
  </div>
</header>
<div class="wrap">
  <section class="week" id="week"></section>
  <aside>
    <div class="card" id="detail"><h2>Event</h2><p class="empty">Drop-off reminders from Snapback appear here as soon as a return is filed.</p></div>
    <div class="card"><h2>All reminders</h2><div class="list" id="list"><p class="empty">None yet.</p></div></div>
  </aside>
</div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  let anchor = params.get("date") ? new Date(params.get("date") + "T12:00") : new Date();
  let events = [], seen = null, selected = location.hash.slice(1) || null, lastJson = "";
  const fresh = new Set();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const day0 = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const weekStart = (d) => { const x = day0(d); x.setDate(x.getDate() - x.getDay()); return x; };
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const fmtTime = (d) => d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const fmtDay = (d) => d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"});

  function render() {
    const ws = weekStart(anchor), days = [...Array(7)].map((_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return d; });
    const we = new Date(ws); we.setDate(ws.getDate() + 7);
    const inWeek = events.filter((e) => e._s >= ws && e._s < we);
    let h0 = 8, h1 = 20;
    inWeek.forEach((e) => { h0 = Math.min(h0, e._s.getHours()); h1 = Math.max(h1, Math.ceil(e._e.getHours() + e._e.getMinutes() / 60)); });
    const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
    const last = days[6];
    const mon = (d) => d.toLocaleDateString([], {month: "short"});
    $("range").textContent = ws.getMonth() === last.getMonth()
      ? `${mon(ws)} ${ws.getDate()} – ${last.getDate()}, ${last.getFullYear()}`
      : `${mon(ws)} ${ws.getDate()} – ${mon(last)} ${last.getDate()}, ${last.getFullYear()}`;
    const today = new Date();
    let html = `<div class="days"><div></div>${days.map((d) => `<div class="${sameDay(d, today) ? "is-today" : ""}">${d.toLocaleDateString([], {weekday: "short"})}<b>${d.getDate()}</b></div>`).join("")}</div>`;
    html += `<div class="grid"><div class="gutter">${[...Array(h1 - h0)].map((_, i) => { const t = new Date(); t.setHours(h0 + i, 0); return `<div>${i ? t.toLocaleTimeString([], {hour: "numeric"}) : ""}</div>`; }).join("")}</div>`;
    days.forEach((d) => {
      const isToday = sameDay(d, today);
      html += `<div class="col${isToday ? " is-today" : ""}" style="height:${(h1 - h0) * hourPx}px">`;
      if (isToday) { const m = (today.getHours() - h0) * 60 + today.getMinutes(); if (m >= 0 && m <= (h1 - h0) * 60) html += `<div class="now" style="top:${m / 60 * hourPx}px"></div>`; }
      inWeek.filter((e) => sameDay(e._s, d)).forEach((e) => {
        const top = ((e._s.getHours() - h0) * 60 + e._s.getMinutes()) / 60 * hourPx;
        const height = Math.max(22, (e._e - e._s) / 3600000 * hourPx - 2);
        html += `<button class="ev${fresh.has(e.event_id) ? " new" : ""}${e.event_id === selected ? " sel" : ""}" data-id="${esc(e.event_id)}" style="top:${top}px;height:${height}px"><strong>${esc(e.title)}</strong><span>${fmtTime(e._s)} – ${fmtTime(e._e)}</span></button>`;
      });
      html += `</div>`;
    });
    $("week").innerHTML = html + `</div>`;
    $("week").querySelectorAll(".ev").forEach((b) => b.addEventListener("click", () => { selected = b.dataset.id; history.replaceState(null, "", "#" + selected); render(); }));
    const sorted = [...events].sort((a, b) => a._s - b._s);
    $("list").innerHTML = sorted.length ? sorted.map((e) => `<button data-id="${esc(e.event_id)}">${esc(e.title)}<small>${fmtDay(e._s)} · ${fmtTime(e._s)}</small></button>`).join("") : `<p class="empty">None yet.</p>`;
    $("list").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { const e = events.find((x) => x.event_id === b.dataset.id); selected = e.event_id; anchor = e._s; history.replaceState(null, "", "#" + selected); render(); }));
    const ev = events.find((e) => e.event_id === selected);
    $("detail").innerHTML = ev
      ? `<h2>Event</h2><h3>${esc(ev.title)}</h3><div class="meta">${fmtDay(ev._s)} · ${fmtTime(ev._s)} – ${fmtTime(ev._e)}${ev.location ? " · " + esc(ev.location) : ""}<br>Alert ${esc(ev.alarm_minutes_before)} min before · ${esc(ev.calendar)}</div><pre class="notes">${linkify(ev.notes)}</pre>`
      : `<h2>Event</h2><p class="empty">Drop-off reminders from Snapback appear here as soon as a return is filed.</p>`;
    const el = document.querySelector(".ev.sel, .ev.new");
    if (el) el.scrollIntoView({block: "nearest"});
  }

  async function poll() {
    try {
      const r = await fetch("/calendar/events.json", {cache: "no-store"});
      const txt = await r.text();
      if (txt !== lastJson) {
        lastJson = txt;
        events = JSON.parse(txt).map((e) => ({...e, _s: new Date(e.start), _e: new Date(e.end)}));
        const ids = new Set(events.map((e) => e.event_id));
        if (seen) {
          const added = events.filter((e) => !seen.has(e.event_id));
          if (added.length) {      // jump to the newest reminder and highlight it
            const e = added[added.length - 1];
            added.forEach((a) => fresh.add(a.event_id));
            setTimeout(() => { added.forEach((a) => fresh.delete(a.event_id)); }, 4000);
            anchor = e._s; selected = e.event_id; history.replaceState(null, "", "#" + selected);
          }
        } else if (!params.get("date") && selected) {
          const e = events.find((x) => x.event_id === selected); if (e) anchor = e._s;
        }
        seen = ids;
        render();
      }
    } catch (err) { /* mock world restarting; try again */ }
  }
  $("prev").onclick = () => { anchor = new Date(anchor); anchor.setDate(anchor.getDate() - 7); render(); };
  $("next").onclick = () => { anchor = new Date(anchor); anchor.setDate(anchor.getDate() + 7); render(); };
  $("today").onclick = () => { anchor = new Date(); render(); };
  render(); poll(); setInterval(poll, 2000);
  setInterval(render, 60000);   // keep the now-line moving
})();
</script>
</body>
</html>
