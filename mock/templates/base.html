<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ store.name if store else "Mock world" }}{% endblock %}</title>
<style>
  :root { --brand: {{ store.color if store else "#333" }}; --accent: {{ store.accent if store else "#ddd" }}; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #f6f5f2; }
  header { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 16px; }
  header a { color: #fff; text-decoration: none; }
  header .logo { font-weight: 800; letter-spacing: .04em; font-size: 20px; }
  header .tag { opacity: .8; font-size: 13px; }
  header nav { margin-left: auto; display: flex; gap: 16px; font-size: 14px; }
  main { max-width: 920px; margin: 28px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .btn { background: var(--brand); color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
  .btn.secondary { background: #e9e7e2; color: #222; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, select { padding: 9px 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; width: 100%; max-width: 360px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .grid img, .thumb { width: 100%; border-radius: 10px; }
  .muted { color: #6b6b6b; font-size: 13px; }
  .ok { color: #1b7f3b; font-weight: 700; }
  .err { color: #b3261e; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: #222; font-size: 12px; font-weight: 600; }
  .demo-banner { background: #fff3cd; color: #5c4400; font-size: 12px; text-align: center; padding: 4px; }
  pre { white-space: pre-wrap; font: 14px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="demo-banner">Fictional store in the Snapback demo environment — not a real retailer.</div>
<header>
  {% if store %}
  <a class="logo" href="/s/{{ store.id }}">{{ store.name }}</a><span class="tag">{{ store.tagline }}</span>
  <nav><a href="/s/{{ store.id }}">Shop</a><a href="/s/{{ store.id }}/returns">Returns</a><a href="/s/{{ store.id }}/policy">Policy</a></nav>
  {% else %}
  <a class="logo" href="/">Mock world</a><span class="tag">stores · inbox · bank · admin</span>
  <nav><a href="/inbox">Inbox</a><a href="/bank">Bank</a><a href="/admin">Admin</a></nav>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
