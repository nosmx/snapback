id: S10
name: Duplicate order (same SKU, same day) -> ask, then cancel the extra one
steps:
  - checkout: {store: kestrel-outdoors, sku: KSO-MERINO-BN}
  - checkout: {store: kestrel-outdoors, sku: KSO-MERINO-BN}
  - loop: true
  - wait_trigger: {trigger_type: duplicate, status: [awaiting_user]}
  - answer: {option: cancel_extra}
